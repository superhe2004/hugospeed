<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码雨骷髅头</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        /* 代码雨画布 */
        #codeRain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.8;
        }

        /* 骷髅头容器 - 居中显示 */
        .skull-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2; /* 层级高于代码雨 */
            filter: drop-shadow(0 0 15px #00ff00); /* 绿色发光效果 */
        }

        /* 骷髅头SVG样式 */
        .skull-svg {
            width: 280px;
            height: 280px;
            fill: #00ff00; /* 骷髅头颜色（荧光绿） */
            opacity: 0.9;
            /* 呼吸动画 */
            animation: breath 3s ease-in-out infinite;
        }

        /* 呼吸动画效果 */
        @keyframes breath {
            0%, 100% {
                opacity: 0.7;
                transform: scale(0.95);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* 响应式适配小屏幕 */
        @media (max-width: 768px) {
            .skull-svg {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- 代码雨画布 -->
    <canvas id="codeRain"></canvas>

    <!-- 骷髅头（SVG矢量图，无失真） -->
    <div class="skull-container">
        <svg class="skull-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- 骷髅头轮廓 -->
            <path d="M50,10 C30,10 15,25 15,45 C15,70 30,85 50,90 C70,85 85,70 85,45 C85,25 70,10 50,10 Z M30,40 C27,40 25,43 25,46 C25,50 27,55 30,60 M70,40 C73,40 75,43 75,46 C75,50 73,55 70,60 M35,65 C30,70 35,75 40,78 M65,65 C70,70 65,75 60,78 M40,70 C38,73 42,76 45,75 M55,70 C57,73 53,76 50,75 M45,80 C40,82 50,82 55,80" />
        </svg>
    </div>

    <script>
        // 代码雨核心逻辑
        (function() {
            const canvas = document.getElementById('codeRain');
            const ctx = canvas.getContext('2d');

            // 适配屏幕大小
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 代码雨配置
            const config = {
                chars: ['0', '1'], // 仅显示0和1
                fontSize: 14,
                speed: 2, // 基础下落速度
                columns: Math.floor(canvas.width / 14), // 列数（根据字体大小计算）
                drops: [] // 存储每列的下落位置
            };

            // 初始化每列的初始位置
            for (let i = 0; i < config.columns; i++) {
                config.drops[i] = Math.random() * -100; // 随机初始位置（顶部外）
            }

            // 绘制代码雨
            function drawCodeRain() {
                // 半透明黑色背景（实现拖影效果）
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 设置文字样式
                ctx.fillStyle = '#00ff00'; // 荧光绿
                ctx.font = `${config.fontSize}px monospace`;

                // 逐列绘制字符
                for (let i = 0; i < config.columns; i++) {
                    // 随机选0或1
                    const char = config.chars[Math.floor(Math.random() * config.chars.length)];
                    // 绘制字符
                    ctx.fillText(char, i * config.fontSize, config.drops[i] * config.fontSize);

                    // 重置下落位置（落到屏幕底部后回到顶部）
                    if (config.drops[i] * config.fontSize > canvas.height && Math.random() > 0.975) {
                        config.drops[i] = 0;
                    }

                    // 随机下落速度（增加动感）
                    config.drops[i] += Math.random() * config.speed + 0.5;
                }

                // 循环绘制
                requestAnimationFrame(drawCodeRain);
            }

            // 启动代码雨
            drawCodeRain();
        })();
    </script>
</body>
</html>
